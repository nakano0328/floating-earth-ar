<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <title>Space Gate AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- AR.js for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /*
        画面全体の星レイヤー。
        背景色やグラデーションは使わず、星だけを重ねる。
      */
    .star-layer {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.1s ease;
    }

    body.space-mode .star-layer {
      opacity: 1;
    }

    .star {
      position: absolute;
      border-radius: 999px;
      background: white;
      opacity: 0.65;
      animation-name: twinkle;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }

    @keyframes twinkle {
      0% {
        opacity: 0.15;
        transform: scale(0.8);
      }

      50% {
        opacity: 0.9;
        transform: scale(1.45);
      }

      100% {
        opacity: 0.25;
        transform: scale(0.9);
      }
    }

    /*
        流れ星。背景ではなく、星だけの演出として追加。
      */
    .shooting-star {
      position: fixed;
      left: -25%;
      top: 24%;
      z-index: 10000;
      width: 120px;
      height: 2px;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(90deg,
          transparent,
          rgba(255, 255, 255, 0.95),
          transparent);
      transform: rotate(-18deg);
    }

    body.space-mode .shooting-star {
      animation: shootingStar 5.2s ease-in-out infinite;
      animation-delay: 1.4s;
    }

    @keyframes shootingStar {
      0% {
        opacity: 0;
        transform: translateX(0) translateY(0) rotate(-18deg);
      }

      10% {
        opacity: 0.9;
      }

      32% {
        opacity: 0;
        transform: translateX(145vw) translateY(36vh) rotate(-18deg);
      }

      100% {
        opacity: 0;
        transform: translateX(145vw) translateY(36vh) rotate(-18deg);
      }
    }

    .hint {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 10002;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.58);
      color: white;
      font-size: 12px;
      letter-spacing: 0.02em;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    body.space-mode .hint {
      opacity: 0;
    }
  </style>
</head>

<body>
  <!-- マーカー認識後に出る、画面全体の星だけの演出 -->
  <div class="star-layer" id="star-layer"></div>
  <div class="shooting-star"></div>

  <div class="hint">Hiroマーカーを映してください</div>

  <a-scene embedded vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker id="hiro-marker" preset="hiro" smooth="true" smooth-count="5" smooth-tolerance="0.01"
      smooth-threshold="2">
      <!-- マーカーを宇宙への入口に見立てたポータルリング -->
      <a-torus position="0 0.04 0" rotation="-90 0 0" radius="0.68" radius-tubular="0.022" color="#7dd3fc"
        material="opacity: 0.82; transparent: true; emissive: #2563eb; emissiveIntensity: 0.6"
        animation="property: rotation; to: -90 360 0; loop: true; dur: 6200; easing: linear"></a-torus>

      <a-torus position="0 0.07 0" rotation="-90 0 0" radius="0.9" radius-tubular="0.01" color="#ffffff"
        material="opacity: 0.5; transparent: true; emissive: #ffffff; emissiveIntensity: 0.3"
        animation="property: rotation; to: -90 -360 0; loop: true; dur: 9800; easing: linear"></a-torus>

      <a-torus position="0 0.1 0" rotation="-90 0 0" radius="0.38" radius-tubular="0.008" color="#a855f7"
        material="opacity: 0.62; transparent: true; emissive: #7e22ce; emissiveIntensity: 0.45"
        animation="property: rotation; to: -90 360 0; loop: true; dur: 4200; easing: linear"></a-torus>

      <!-- 地球の影 -->
      <a-circle position="0 0.025 0" rotation="-90 0 0" radius="0.48" color="#000000"
        material="opacity: 0.24; transparent: true"></a-circle>

      <!-- 地球全体。少し上下に浮く -->
      <a-entity id="earth-wrapper" position="0 0.82 0"
        animation="property: position; dir: alternate; dur: 1700; loop: true; easing: easeInOutSine; to: 0 0.98 0">
        <!-- 地球本体。ここ全体を回転させる -->
        <a-entity id="earth" animation="property: rotation; to: 0 360 0; loop: true; dur: 8500; easing: linear">
          <!-- 海 -->
          <a-sphere radius="0.46" color="#2fa7ff"
            material="roughness: 0.3; metalness: 0.05; emissive: #1e90ff; emissiveIntensity: 0.2"></a-sphere>

          <!-- 陸地っぽい緑のパーツ：前面 -->
          <a-sphere radius="0.12" color="#2ecc71" position="-0.18 0.13 0.43" scale="1.65 0.45 0.75"></a-sphere>

          <a-sphere radius="0.095" color="#27ae60" position="0.18 -0.04 0.44" scale="1.35 0.45 0.72"></a-sphere>

          <a-sphere radius="0.075" color="#2ecc71" position="-0.05 -0.22 0.44" scale="1.4 0.4 0.65"></a-sphere>

          <!-- 陸地っぽい緑のパーツ：裏側 -->
          <a-sphere radius="0.105" color="#2ecc71" position="0.10 0.22 -0.42" scale="1.45 0.45 0.75"></a-sphere>

          <a-sphere radius="0.085" color="#27ae60" position="-0.25 -0.15 -0.37" scale="1.6 0.42 0.7"></a-sphere>

          <!-- 地球の周りの薄いリング -->
          <a-torus color="#dff6ff" radius="0.59" radius-tubular="0.01" rotation="75 0 20"
            material="opacity: 0.72; transparent: true; emissive: #9be8ff; emissiveIntensity: 0.22"></a-torus>
        </a-entity>
      </a-entity>

      <!-- 月の軌道。親要素を回転させて月を周回させる -->
      <a-entity id="moon-orbit" position="0 0.9 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4800; easing: linear">
        <a-sphere radius="0.09" color="#d9d9d9" position="0.85 0.08 0"
          material="roughness: 0.8; emissive: #ffffff; emissiveIntensity: 0.08"></a-sphere>

        <!-- 月の軌道線 -->
        <a-torus position="0 0.08 0" rotation="90 0 0" radius="0.85" radius-tubular="0.004" color="#ffffff"
          material="opacity: 0.24; transparent: true"></a-torus>
      </a-entity>

      <!-- 人工衛星。月とは逆方向に周回する -->
      <a-entity id="satellite-orbit" position="0 0.92 0"
        animation="property: rotation; to: 0 -360 0; loop: true; dur: 6500; easing: linear">
        <a-entity position="-1.08 0.16 0" rotation="0 0 0">
          <!-- 衛星本体 -->
          <a-box width="0.13" height="0.09" depth="0.09" color="#d1d5db"
            material="metalness: 0.35; roughness: 0.35; emissive: #ffffff; emissiveIntensity: 0.06"></a-box>

          <!-- 太陽光パネル -->
          <a-box width="0.28" height="0.045" depth="0.012" position="-0.22 0 0" color="#2563eb"
            material="metalness: 0.2; roughness: 0.45"></a-box>

          <a-box width="0.28" height="0.045" depth="0.012" position="0.22 0 0" color="#2563eb"
            material="metalness: 0.2; roughness: 0.45"></a-box>

          <!-- 小さいアンテナ -->
          <a-cylinder radius="0.01" height="0.16" position="0 0.12 0" rotation="0 0 0" color="#f8fafc"></a-cylinder>

          <a-sphere radius="0.025" position="0 0.21 0" color="#f8fafc"
            material="emissive: #ffffff; emissiveIntensity: 0.18"></a-sphere>
        </a-entity>

        <!-- 衛星の軌道線 -->
        <a-torus position="0 0.16 0" rotation="90 0 0" radius="1.08" radius-tubular="0.003" color="#ffffff"
          material="opacity: 0.2; transparent: true"></a-torus>
      </a-entity>

      <!-- マーカー周辺に浮く小さな星 -->
      <a-sphere radius="0.035" color="#fff7ad" position="-0.82 1.16 -0.35"
        material="emissive: #fff7ad; emissiveIntensity: 0.7"></a-sphere>

      <a-sphere radius="0.025" color="#ffffff" position="0.68 1.34 0.28"
        material="emissive: #ffffff; emissiveIntensity: 0.6"></a-sphere>

      <a-sphere radius="0.03" color="#fff7ad" position="0.45 0.55 -0.72"
        material="emissive: #fff7ad; emissiveIntensity: 0.5"></a-sphere>

      <a-sphere radius="0.022" color="#ffffff" position="-0.48 0.65 0.68"
        material="emissive: #ffffff; emissiveIntensity: 0.6"></a-sphere>

      <a-sphere radius="0.028" color="#fff7ad" position="0.12 1.45 -0.58"
        material="emissive: #fff7ad; emissiveIntensity: 0.5"></a-sphere>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const marker = document.querySelector("#hiro-marker");
      const starLayer = document.querySelector("#star-layer");

      let hasOpenedGate = false;

      // 画面全体に星をランダム生成する
      const createStars = () => {
        const starCount = 70;

        for (let i = 0; i < starCount; i++) {
          const star = document.createElement("div");
          star.className = "star";

          const size = Math.random() * 2.0 + 0.8;
          const left = Math.random() * 100;
          const top = Math.random() * 100;
          const duration = Math.random() * 2.8 + 1.8;
          const delay = Math.random() * 3;

          star.style.width = `${size}px`;
          star.style.height = `${size}px`;
          star.style.left = `${left}%`;
          star.style.top = `${top}%`;
          star.style.animationDuration = `${duration}s`;
          star.style.animationDelay = `${delay}s`;

          if (Math.random() > 0.86) {
            star.style.boxShadow = "0 0 7px rgba(255, 255, 255, 0.75)";
          }

          starLayer.appendChild(star);
        }
      };

      createStars();

      // Hiroマーカーを認識したら星レイヤーを表示する
      marker.addEventListener("markerFound", () => {
        if (!hasOpenedGate) {
          hasOpenedGate = true;
          document.body.classList.add("space-mode");
        }
      });

      /*
        markerLost では space-mode を消さない。
        これにより、Hiroマーカーを一度見たあとにスマホを別方向へ向けても、
        画面上では星の演出が残る。
      */
    });
  </script>
</body>

</html>
