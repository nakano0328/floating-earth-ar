<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Floating Earth AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      .hint {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 10;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        color: white;
        font-family: sans-serif;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <div class="hint">マーカーをカメラに映してください</div>

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true; antialias: true"
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- 最初はHiroマーカーで動作確認 -->
      <a-marker
        preset="hiro"
        smooth="true"
        smooth-count="5"
        smooth-tolerance="0.01"
        smooth-threshold="2"
      >
        <!-- 地球全体。これを回転させる -->
        <a-entity
          id="earth"
          position="0 0.75 0"
          rotation="0 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear"
        >
          <!-- 地球の本体 -->
          <a-sphere
            radius="0.45"
            color="#1e90ff"
            material="roughness: 0.45; metalness: 0.05"
          ></a-sphere>

          <!-- 陸地っぽい緑のパーツ -->
          <a-sphere
            radius="0.13"
            color="#2ecc71"
            position="-0.18 0.12 0.42"
            scale="1.5 0.45 0.8"
          ></a-sphere>

          <a-sphere
            radius="0.10"
            color="#27ae60"
            position="0.20 -0.02 0.43"
            scale="1.2 0.4 0.7"
          ></a-sphere>

          <a-sphere
            radius="0.09"
            color="#2ecc71"
            position="0.06 0.23 -0.41"
            scale="1.4 0.45 0.8"
          ></a-sphere>

          <a-sphere
            radius="0.08"
            color="#27ae60"
            position="-0.26 -0.18 -0.35"
            scale="1.5 0.4 0.7"
          ></a-sphere>

          <!-- 少し宇宙っぽいリング -->
          <a-torus
            color="#bfefff"
            radius="0.58"
            radius-tubular="0.01"
            rotation="75 0 20"
            material="opacity: 0.65; transparent: true"
          ></a-torus>
        </a-entity>

        <!-- 地球の下の影 -->
        <a-circle
          position="0 0.03 0"
          rotation="-90 0 0"
          radius="0.42"
          color="#000000"
          material="opacity: 0.25; transparent: true"
        ></a-circle>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
