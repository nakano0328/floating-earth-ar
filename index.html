<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Floating Earth Portal AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }

      .hint {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 10;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        color: white;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <div class="hint">Hiroマーカーをカメラに映してください</div>

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true; antialias: true"
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <a-marker
        preset="hiro"
        smooth="true"
        smooth-count="5"
        smooth-tolerance="0.01"
        smooth-threshold="2"
      >
        <!-- マーカー上のポータルリング -->
        <a-torus
          position="0 0.04 0"
          rotation="-90 0 0"
          radius="0.62"
          radius-tubular="0.018"
          color="#7dd3fc"
          material="opacity: 0.75; transparent: true"
          animation="property: rotation; to: -90 360 0; loop: true; dur: 7000; easing: linear"
        ></a-torus>

        <a-torus
          position="0 0.06 0"
          rotation="-90 0 0"
          radius="0.82"
          radius-tubular="0.008"
          color="#ffffff"
          material="opacity: 0.45; transparent: true"
          animation="property: rotation; to: -90 -360 0; loop: true; dur: 11000; easing: linear"
        ></a-torus>

        <!-- 地球の影 -->
        <a-circle
          position="0 0.03 0"
          rotation="-90 0 0"
          radius="0.42"
          color="#000000"
          material="opacity: 0.22; transparent: true"
        ></a-circle>

        <!-- 地球全体。少し上下に浮く -->
        <a-entity
          id="earth-wrapper"
          position="0 0.78 0"
          animation="property: position; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine; to: 0 0.92 0"
        >
          <!-- 地球本体。ここ全体を回転させる -->
          <a-entity
            id="earth"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8500; easing: linear"
          >
            <!-- 海 -->
            <a-sphere
              radius="0.43"
              color="#1e90ff"
              material="roughness: 0.35; metalness: 0.05"
            ></a-sphere>

            <!-- 陸地っぽい緑のパーツ：前面 -->
            <a-sphere
              radius="0.12"
              color="#2ecc71"
              position="-0.18 0.13 0.40"
              scale="1.65 0.45 0.75"
            ></a-sphere>

            <a-sphere
              radius="0.095"
              color="#27ae60"
              position="0.18 -0.04 0.41"
              scale="1.35 0.45 0.72"
            ></a-sphere>

            <a-sphere
              radius="0.075"
              color="#2ecc71"
              position="-0.05 -0.22 0.42"
              scale="1.4 0.4 0.65"
            ></a-sphere>

            <!-- 陸地っぽい緑のパーツ：裏側 -->
            <a-sphere
              radius="0.105"
              color="#2ecc71"
              position="0.10 0.22 -0.39"
              scale="1.45 0.45 0.75"
            ></a-sphere>

            <a-sphere
              radius="0.085"
              color="#27ae60"
              position="-0.25 -0.15 -0.34"
              scale="1.6 0.42 0.7"
            ></a-sphere>

            <!-- 地球の周りの薄いリング -->
            <a-torus
              color="#dff6ff"
              radius="0.56"
              radius-tubular="0.01"
              rotation="75 0 20"
              material="opacity: 0.7; transparent: true"
            ></a-torus>
          </a-entity>
        </a-entity>

        <!-- 月の軌道。親要素を回転させて月を周回させる -->
        <a-entity
          id="moon-orbit"
          position="0 0.85 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear"
        >
          <a-sphere
            radius="0.09"
            color="#d9d9d9"
            position="0.82 0.08 0"
            material="roughness: 0.8"
          ></a-sphere>
        </a-entity>

        <!-- 周囲の星 -->
        <a-sphere
          radius="0.035"
          color="#fff7ad"
          position="-0.75 1.15 -0.35"
        ></a-sphere>

        <a-sphere
          radius="0.025"
          color="#ffffff"
          position="0.68 1.32 0.28"
        ></a-sphere>

        <a-sphere
          radius="0.03"
          color="#fff7ad"
          position="0.45 0.55 -0.72"
        ></a-sphere>

        <a-sphere
          radius="0.022"
          color="#ffffff"
          position="-0.48 0.65 0.68"
        ></a-sphere>

        <a-sphere
          radius="0.028"
          color="#fff7ad"
          position="0.12 1.42 -0.58"
        ></a-sphere>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
